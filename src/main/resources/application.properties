
spring.application.name=llm-benchmark
server.port=8080

# OpenAI API
# 키는 여기 쓰지 말 것. 프로젝트 루트의 application-local.properties 또는 OPENAI_API_KEY 환경변수로 넣는다.
openai.api-key=${OPENAI_API_KEY:}
spring.config.import=optional:file:./application-local.properties
openai.api-url=https://api.openai.com/v1/responses

# 비교할 모델
benchmark.models=gpt-5-mini,gpt-5-nano

# ===== 벤치마크 설정 =====
# 케이스당 반복 횟수 (LLM 출력 편차를 보려면 3회 이상)
benchmark.repeats=3
# 실행할 케이스 (비우면 전체 C01~C07)
benchmark.cases=
# 두 모델에 동일하게 적용 (minimal / low / medium / high)
benchmark.reasoning-effort=low
benchmark.max-turns=8
benchmark.max-output-tokens=8000
benchmark.log-dir=bench-logs
# true 면 bootRun 직후 바로 실행. false 면 POST /api/benchmark/run 으로 실행
benchmark.run-on-startup=false

# 단가 (USD / 1M tokens) - 실행 전에 OpenAI 가격표와 맞는지 확인할 것
benchmark.pricing[gpt-5-mini].input=0.25
benchmark.pricing[gpt-5-mini].cached-input=0.025
benchmark.pricing[gpt-5-mini].output=2.00
benchmark.pricing[gpt-5-nano].input=0.05
benchmark.pricing[gpt-5-nano].cached-input=0.005
benchmark.pricing[gpt-5-nano].output=0.40
